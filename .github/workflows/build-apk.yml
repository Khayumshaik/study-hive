name: Build Debug APK

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

# Cancel superseded runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Verify debug keystore is readable
        run: keytool -list -keystore debug.keystore -storepass android | head -8

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p apk-out
          cp app/build/outputs/apk/debug/app-debug.apk apk-out/StudyHive-debug.apk
          sha256sum apk-out/StudyHive-debug.apk | tee apk-out/SHA256SUMS.txt
          ls -la apk-out

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyHive-debug-apk
          path: apk-out/
          if-no-files-found: error

      - name: Attach APK to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: debug-build
          name: StudyHive Debug APK
          files: |
            apk-out/StudyHive-debug.apk
            apk-out/SHA256SUMS.txt
          body: |
            Automated debug build of StudyHive.
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
