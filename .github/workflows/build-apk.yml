name: Build Debug APK

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

# Cancel superseded runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Verify debug keystore is readable
        run: keytool -list -keystore debug.keystore -storepass android | head -8

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      # The sandbox that drives this repo cannot access GitHub's log CDN,
      # so on failure we commit the log tail to the branch (with [skip ci]
      # so this does not re-trigger the workflow).
      - name: Publish failure log to branch
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p .ci-logs
          tail -n 500 build.log > .ci-logs/build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-logs
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci: capture build failure log [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Collect APK
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p apk-out
          cp app/build/outputs/apk/debug/app-debug.apk apk-out/StudyHive-debug.apk
          sha256sum apk-out/StudyHive-debug.apk | tee apk-out/SHA256SUMS.txt
          ls -la apk-out

      - name: Upload APK as workflow artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: StudyHive-debug-apk
          path: apk-out/
          if-no-files-found: error

      - name: Attach APK to draft release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: debug-build
          name: StudyHive Debug APK
          files: |
            apk-out/StudyHive-debug.apk
            apk-out/SHA256SUMS.txt
          body: |
            Automated debug build of StudyHive.
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
